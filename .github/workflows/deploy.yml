name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Work out the public address and base path
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${CUSTOM_SITE_URL}" ]; then
            SITE="${CUSTOM_SITE_URL}"; BASE="/"
          elif [ "${REPO}" = "${OWNER}.github.io" ]; then
            SITE="https://${OWNER}.github.io"; BASE="/"
          else
            SITE="https://${OWNER}.github.io"; BASE="/${REPO}"
          fi
          echo "SITE_URL=${SITE}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${BASE}" >> "$GITHUB_ENV"
          echo "Building for ${SITE}${BASE}"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

